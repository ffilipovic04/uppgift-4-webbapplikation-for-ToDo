<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>My ToDo</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>


    <div class="todo-container">
        <h1 class="fade-in-item item-1"> My ToDo</h1>

    
        <div class="counter-section fade-in-item item-2">
            <span id="completed-count">0</span> completed
        </div>

        <div class="input-section fade-in-item item-3">
            <input type="text" id="todo-input">
            <button id="add-btn">OK</button>
        </div>

        <div id="error-message" class="error-text"></div>

        <ul id="todo-list"></ul>
    </div>

    <script src="script.js"></script>

</body>
</html>
